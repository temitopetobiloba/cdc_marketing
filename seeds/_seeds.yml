# =============================================================================
# SEEDS = small, slow-changing CSV files that live in Git and are loaded with
# `dbt seed` (or `dbt build`). Good for lookup tables a human maintains.
#
# currency_rates: Facebook accounts bill in EUR *and* USD. Summing them as-is
# would add dollars to euros. Every spend figure is converted to EUR using
# the rate valid on the reporting day.
#
# ⚠ The USD rates are approximate yearly averages. For finance-grade numbers,
#   replace with daily ECB reference rates (same columns, one row per day).
# =============================================================================
version: 2

seeds:
  - name: currency_rates
    description: >
      Exchange rates to EUR. **Grain: one row per currency per validity period.**
      A spend amount on day D in currency C converts with the row where
      valid_from <= D <= valid_to.
    config:
      column_types:
        currency_code: string
        valid_from: date
        valid_to: date
        rate_to_eur: decimal(18, 6)
        rate_source: string
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [currency_code, valid_from]
    columns:
      - name: currency_code
        description: ISO-4217 currency code.
        data_tests: [not_null]
      - name: valid_from
        description: First day the rate applies (inclusive).
      - name: valid_to
        description: Last day the rate applies (inclusive).
      - name: rate_to_eur
        description: Multiply an amount in currency_code by this to get EUR.
        data_tests:
          - not_null
          - dbt_utils.expression_is_true:
              arguments:
                expression: "> 0"
      - name: rate_source
        description: Where the rate came from.
