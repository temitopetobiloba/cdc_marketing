# =============================================================================
# Marts: the analyst-facing layer. Descriptions are pushed into Unity Catalog
# (persist_docs), so analysts and AI agents see them inside Databricks too.
# =============================================================================
version: 2

models:

  # ---------------------------------------------------------------------------
  - name: fct_ad_performance_daily
    description: >
      Core fact table of advertising delivery across Facebook and Snapchat.
      **Grain: one row per ad, per platform, per day, per country**
      (country_code is NULL for Facebook, which does not split by country).
      Only additive measures. Incremental (merge).
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [platform, ad_id, date_day, country_code]
      - elementary.volume_anomalies:
          arguments:
            timestamp_column: date_day
            time_bucket: {period: day, count: 1}
          config: {severity: warn}
    columns:
      - name: ad_performance_id
        description: Primary key. Hash of platform, ad_id, date_day, country_code.
        data_tests: [unique, not_null]
      - name: campaign_key
        description: Foreign key to dim_campaigns.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_campaigns')
                field: campaign_key
      - name: date_day
        description: Reporting day.
        data_tests: [not_null]
      - name: platform
        description: '{{ doc("platform") }}'
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['facebook', 'snapchat']
      - name: country_code
        description: ISO country where the ad was shown (Snapchat only; NULL for Facebook).
      - name: account_id
        description: Ad account that paid.
      - name: campaign_id
        description: Platform-native campaign id (unique only within a platform).
        data_tests: [not_null]
      - name: ad_group_id
        description: Facebook ad set / Snapchat ad squad id.
      - name: ad_group_name
        description: Facebook ad set / Snapchat ad squad name.
      - name: ad_id
        description: Platform-native ad id.
        data_tests: [not_null]
      - name: ad_name
        description: Ad (creative) name.
      - name: ad_status
        description: Facebook ad status (active, paused, archived, deleted). NULL for Snapchat.
      - name: currency_code
        description: Currency of `spend` (the account's billing currency).
        data_tests:
          - accepted_values:
              arguments:
                values: ['EUR', 'USD']
      - name: spend
        description: Spend in currency_code. Do NOT add across currencies; use spend_eur.
        data_tests:
          - dbt_utils.expression_is_true:
              arguments:
                expression: ">= 0"
      - name: rate_to_eur
        description: Exchange rate applied (from seed currency_rates).
        data_tests: [not_null]
      - name: spend_eur
        description: '{{ doc("metric_spend") }}'
        data_tests:
          - not_null
          - dbt_utils.expression_is_true:
              arguments:
                expression: ">= 0"
          - elementary.column_anomalies:
              arguments:
                column_anomalies: [sum]
                timestamp_column: date_day
              config: {severity: warn}
      - name: impressions
        description: '{{ doc("metric_impressions") }}'
        data_tests:
          - dbt_utils.expression_is_true:
              arguments:
                expression: ">= 0"
      - name: clicks
        description: '{{ doc("metric_clicks") }}'
        data_tests:
          - dbt_utils.expression_is_true:
              arguments:
                expression: ">= 0"
      - name: is_impressions_missing
        description: True when the source reported "null" impressions (stored as 0).
      - name: is_clicks_missing
        description: True when the source reported "null" clicks (stored as 0).
      - name: source_loaded_at
        description: When the raw row was loaded into bronze.
      - name: dbt_updated_at
        description: When dbt last inserted/updated this row.

  # ---------------------------------------------------------------------------
  - name: dim_campaigns
    description: >
      Every campaign on every platform, with its account, currency and
      activity window. **Grain: one row per campaign per platform.**
    columns:
      - name: campaign_key
        description: Primary key. Hash of platform + campaign_id.
        data_tests: [unique, not_null]
      - name: platform
        description: '{{ doc("platform") }}'
        data_tests:
          - accepted_values:
              arguments:
                values: ['facebook', 'snapchat']
      - name: campaign_id
        data_tests: [not_null]
      - name: campaign_name
        data_tests: [not_null]
      - name: account_id
        description: Owning ad account (NULL for Facebook campaigns that have no ads in the export).
      - name: account_name
      - name: currency_code
        description: Billing currency of the account.
      - name: first_active_date
        description: First day with delivery (NULL if the campaign never delivered).
      - name: last_active_date
        description: Last day with delivery.
      - name: lifetime_spend_eur
        description: Total spend in EUR across all days.
      - name: has_delivery
        description: True if the campaign appears in the performance data.

  # ---------------------------------------------------------------------------
  - name: mart_campaign_performance_daily
    description: >
      **Analyst / BI / AI-agent entry point.** Daily campaign performance
      across Facebook and Snapchat, in EUR, with ready-made KPIs.
      **Grain: one row per campaign, per platform, per day.**
      Sum spend_eur / impressions / clicks freely; re-compute CTR/CPC/CPM from
      sums when aggregating beyond campaign-day.
      ⚠ Facebook data covers 2025 and Snapchat data covers 2024: filter on
      `year` before comparing platforms.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [platform, campaign_id, date_day]
    columns:
      - name: campaign_day_id
        description: Primary key. Hash of campaign_key + date_day.
        data_tests: [unique, not_null]
      - name: date_day
        description: Reporting day.
        data_tests: [not_null]
      - name: week_start_date
        description: Monday of the reporting week.
      - name: month_start_date
        description: First day of the reporting month.
      - name: year
        description: Calendar year of date_day.
      - name: platform
        description: '{{ doc("platform") }}'
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['facebook', 'snapchat']
      - name: campaign_key
        description: Foreign key to dim_campaigns.
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_campaigns')
                field: campaign_key
      - name: campaign_id
        description: Platform-native campaign id.
      - name: campaign_name
        description: Campaign name.
        data_tests: [not_null]
      - name: account_id
        description: Ad account that paid.
      - name: account_name
        description: Ad account name.
      - name: local_currency_code
        description: Billing currency of the account (EUR or USD).
      - name: active_ads
        description: Distinct ads that delivered for the campaign that day.
      - name: countries
        description: Distinct countries delivered to that day (0 for Facebook).
      - name: spend_eur
        description: '{{ doc("metric_spend") }}'
        data_tests: [not_null]
      - name: spend_local
        description: Spend in the account's own currency (local_currency_code).
      - name: impressions
        description: '{{ doc("metric_impressions") }}'
      - name: clicks
        description: '{{ doc("metric_clicks") }}'
      - name: ctr
        description: '{{ doc("metric_ctr") }}'
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 1
              config: {severity: warn}
      - name: cpc_eur
        description: '{{ doc("metric_cpc") }}'
      - name: cpm_eur
        description: '{{ doc("metric_cpm") }}'
      - name: has_imputed_clicks
        description: True if any ad that day had "null" clicks in the source (treated as 0).
