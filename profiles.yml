cdc_marketing_profile:
  target: dev
  outputs:
    dev:
      type: databricks
      host: "{{ env_var('DATABRICKS_HOST') }}"
      http_path: "{{ env_var('DATABRICKS_HTTP_PATH') }}"
      token: "{{ env_var('DATABRICKS_TOKEN') }}"
      catalog: "{{ env_var('DBT_DEV_CATALOG', 'third_layer') }}"
      schema: "{{ env_var('DBT_DEV_SCHEMA', 'marketing_dev') }}"
      threads: 4